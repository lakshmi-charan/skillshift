id: numpy_ops
title: Numeric procedures built on NumPy
domain: tool
summary: >
  A small in-house library of reusable NumPy procedures used by analytics and signal-processing jobs:
  descriptive statistics, membership filtering of ID arrays, numerical integration of sampled signals,
  array serialisation for caches, feature-matrix assembly and percentile reports. Code runs on
  CPython 3.12 with the NumPy version installed in the deployment environment. Functions must keep
  their names, signatures and documented behaviour so that existing callers keep working.
states:
  - id: s0
    date: "2024-02-05"
    label: "NumPy 1.26.4"
    env: {python: "3.12", packages: {numpy: "1.26.4"}}
  - id: s1
    date: "2024-06-16"
    label: "NumPy 2.0.2"
    env: {python: "3.12", packages: {numpy: "2.0.2"}}
    event:
      id: numpy-2.0
      kind: tool
      title: "NumPy 2.0: main-namespace cleanup (np.float_, np.NaN, np.Inf, product/cumproduct/alltrue/sometrue removed)"
      source: "https://github.com/numpy/numpy/blob/v2.0.0/doc/source/release/2.0.0-notes.rst"
      doc: docs/numpy-2.0.md
  - id: s2
    date: "2025-06-07"
    label: "NumPy 2.3.5"
    env: {python: "3.12", packages: {numpy: "2.3.5"}}
    event:
      id: numpy-2.3
      kind: tool
      title: "NumPy 2.3: expired deprecations (ndarray.tostring removed, binary fromstring errors)"
      source: "https://github.com/numpy/numpy/blob/v2.3.0/doc/source/release/2.3.0-notes.rst"
      doc: docs/numpy-2.3.md
  - id: s3
    date: "2025-12-20"
    label: "NumPy 2.4.6"
    env: {python: "3.12", packages: {numpy: "2.4.6"}}
