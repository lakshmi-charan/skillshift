id: np_filter_events
function: filter_events
relevant_skills: [membership]
prompt: |
  Write a Python function `filter_events(ids, allowed, blocked) -> list` using NumPy. `ids` is a sequence
  (list or 1-D array) of integer event IDs that may contain duplicates. Return, as a Python list in the
  original order with duplicates kept, the IDs that occur in `allowed` and do not occur in `blocked`.
tests: tasks/test_np_filter_events.py
