id: ph_signup
function: validate_signup
relevant_skills: [user_schema]
prompt: |
  Write a Python function `validate_signup(data: dict) -> dict` for a sign-up endpoint. Required fields:
  `username` (alphanumeric string) and `email` (valid e-mail address). Optional: `plan` (default "free",
  must be one of "free", "pro", "team") and `age` (integer, 16 to 120 inclusive). Unknown keys are dropped.
  Return the cleaned dict (with the default plan filled in); on invalid input raise ValueError whose
  `messages` attribute is a dict mapping each invalid field name to a list of error messages.
tests: tasks/test_ph_signup.py
