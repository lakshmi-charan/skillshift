id: password_storage
title: Password storage under the OWASP Password Storage Cheat Sheet
domain: policy
summary: >
  The organisation's rule is that new password hashes must follow the current revision of the OWASP
  Password Storage Cheat Sheet. The deployment has Argon2id (argon2-cffi) and scrypt (hashlib) available,
  and a FIPS-mode subsystem uses PBKDF2. Library versions are fixed; only the policy text changes.
  Existing stored hashes of any format must remain verifiable (legacy verification is always permitted).
standing_policy:
  - id: org-owasp
    text: "New password hashes must meet the current OWASP Password Storage Cheat Sheet. Stored hashes of older formats must still verify so that users can log in and be re-hashed."
states:
