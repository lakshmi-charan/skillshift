    date: "2021-03-17"
    label: "OWASP cheat sheet @728bbcd"
    env: {python: "3.11", packages: {bcrypt: "4.0.1", argon2-cffi: "21.3.0"}}
    policy_doc: docs/owasp-2021-03-17-full.md
  - id: s1
    date: "2022-06-10"
    label: "OWASP cheat sheet @422ec84"
    env: {python: "3.11", packages: {bcrypt: "4.0.1", argon2-cffi: "21.3.0"}}
    policy_doc: docs/owasp-2022-06-10-full.md
    event: {id: owasp-2022-06-10, kind: policy, title: "OWASP Password Storage Cheat Sheet revision (Argon2id first; bcrypt for legacy systems; scrypt parameters)",
