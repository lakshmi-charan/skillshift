            source: "https://github.com/OWASP/CheatSheetSeries/commit/02bfdad", doc: docs/owasp-2026-03-26-diff.md}
  - id: s5
    date: "2026-05-12"
    label: "OWASP cheat sheet @c3c1952"
    env: {python: "3.11", packages: {bcrypt: "4.0.1", argon2-cffi: "21.3.0"}}
