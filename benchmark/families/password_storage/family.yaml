    label: "OWASP cheat sheet @f14bc4c"
    env: {python: "3.11", packages: {bcrypt: "4.0.1", argon2-cffi: "21.3.0"}}
    policy_doc: docs/owasp-2023-01-24-full.md
    event: {id: owasp-2023-01-24, kind: policy, title: "OWASP Password Storage Cheat Sheet revision (PBKDF2 iterations; Argon2id 19 MiB; scrypt 2^17)",
            source: "https://github.com/OWASP/CheatSheetSeries/commit/f14bc4c", doc: docs/owasp-2023-01-24-diff.md}
  - id: s3
    date: "2024-12-09"
    label: "OWASP cheat sheet @f387056"
    env: {python: "3.11", packages: {bcrypt: "4.0.1", argon2-cffi: "21.3.0"}}
    policy_doc: docs/owasp-2024-12-09-full.md
    event: {id: owasp-2024-12-09, kind: policy, title: "OWASP Password Storage Cheat Sheet revision (bcrypt only for legacy systems without Argon2/scrypt)",
            source: "https://github.com/OWASP/CheatSheetSeries/commit/f387056", doc: docs/owasp-2024-12-09-diff.md}
  - id: s4
    date: "2026-03-26"
